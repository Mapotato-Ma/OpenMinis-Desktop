name: Build Windows desktop app

# Produces a ready-to-run OpenMinisDesktop.exe without needing a Windows
# machine locally. Two ways to get a build:
#
#   * Actions tab -> "Build Windows desktop app" -> Run workflow
#     (artifact "OpenMinisDesktop-windows" appears on the run page)
#   * push a tag:  git tag v0.1.2 && git push origin v0.1.2
#     (a GitHub Release is created with the exe attached)

on:
  workflow_dispatch:
  push:
    # Tag pushes are what create a Release. Note GitHub does not evaluate
    # `paths` for tag pushes, so `v*` tags always build.
    branches: [main]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'web/desktop/**'
      - 'packaging/OpenMinisDesktop.spec'
      - 'desktop_main.py'
      - 'pyproject.toml'
      # The suite that step 6 runs lives here. Without this, a fix to the tests
      # could not itself be verified by CI — which is how a Windows-only
      # UnicodeEncodeError in the test output went unnoticed until it was the
      # product code that was fine and the test that crashed.
      - 'scripts/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'web/desktop/**'
      - 'packaging/OpenMinisDesktop.spec'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  # 只发便携版（onedir）。onefile 那版已经删掉了 —— 它每次启动都要把载荷解到
  # %TEMP%（办公电脑上还要过一遍杀软实时扫描），而两个形态并存只会让人不知道该下
  # 哪个。启动速度的对比数据留在 v0.3.x 的 release 里，需要时去翻。
  portable:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "pywebview>=5.0" "pyinstaller>=6.6"

      - name: Generate icon
        shell: pwsh
        run: python scripts/make_icon.py

      - name: Build portable (onedir) app
        shell: pwsh
        env:
          OPENMINIS_ONEFILE: '0'
          OPENMINIS_CONSOLE: '0'
        run: python -m PyInstaller --noconfirm --clean packaging/OpenMinisDesktop.spec

      - name: Report startup timeline (portable)
        shell: pwsh
        run: pwsh -File scripts/startup_probe.ps1 -ExePath dist\OpenMinisDesktop\OpenMinisDesktop.exe -Port 8802

      - name: Build the update payload (payload/)
        shell: pwsh
        # "更新只换几 MB"的那一半：把内核与界面单独装成一个可整体替换的目录。
        # 它排在 sys.path 最前面，所以盖过 exe 里冻住的那一份 —— 已经装好的实例
        # 更新时只需要换这一个目录（实测 2.3MB），不用重发 37.9MB 的整包。
        run: |
          python scripts/make_payload.py --out dist\OpenMinisDesktop\payload --zip dist\OpenMinisDesktop-update.zip
          if ($LASTEXITCODE -ne 0) { Write-Error "payload build failed"; exit 1 }

      - name: Verify the payload actually shadows the bundled kernel
        shell: pwsh
        # 没有这一步，"载荷在不在、用没用上"就只能靠用户报"更新后没反应"。
        # 断言的是**加载来源**：内核必须来自 payload\，不是 exe 里冻住的那份。
        run: |
          $p = Start-Process -FilePath dist\OpenMinisDesktop\OpenMinisDesktop.exe -ArgumentList "--no-window","--port","8804" -PassThru
          # 按端口过滤（上一步 startup_probe 用的是 8802，它的令牌还留在文件里），
          # 而且请求本身也重试 —— 双保险，免得再被自己的闸门挡一次。
          $access = $null
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 2
            $p.Refresh(); if ($p.HasExited) { break }
            try {
              $access = Get-Content "$env:USERPROFILE\openminis\.desktop-access.json" -Raw | ConvertFrom-Json
              if ($access.token -and $access.port -eq 8804) { break }
            } catch { }
          }
          $auth = @{ 'x-minis-desktop-access' = $access.token }
          $info = $null
          for ($i = 0; $i -lt 15; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 -Headers $auth "http://127.0.0.1:8804/api/desktop/info"
              if ($r.StatusCode -eq 200) { $info = $r.Content | ConvertFrom-Json; break }
            } catch { }
            Start-Sleep -Seconds 1
          }
          if (-not $info) {
            Write-Error "could not read /api/desktop/info from the packaged app"
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          # 访问闸门必须在场：无令牌打 /api/* 必须 403（打包版漏装闸门 = 任意网页
          # 都能驱动本机这个手里有 shell 的 agent）。这条原本在 onefile 那个 job 里，
          # 删掉那个 job 时**不能连它一起删**。
          $gateCode = 0
          try {
            $null = Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 "http://127.0.0.1:8804/api/chats/sessions"
            $gateCode = 200
          } catch { $gateCode = [int]$_.Exception.Response.StatusCode }
          if ($gateCode -ne 403) {
            Write-Error "access gate missing: unauthenticated /api/* answered $gateCode (expected 403)"
            exit 1
          }
          Write-Host "access gate ok: unauthenticated /api/* -> 403"

          # 界面真的进了包（不然 exe 跑在没有 ui-prefs 的旧界面上）
          $ui = Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 "http://127.0.0.1:8804/_desktop/"
          if ($ui.Content -notmatch 'OpenMinis Desktop') {
            Write-Error "frozen exe served the wrong UI"
            exit 1
          }
          foreach ($asset in @('ui-prefs.js', 'vendor/webawesome/components/dialog/dialog.js')) {
            $code = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 "http://127.0.0.1:8804/_desktop/$asset").StatusCode
            if ($code -ne 200) { Write-Error "packaged UI is missing $asset"; exit 1 }
          }
          Write-Host "packaged UI ok"

          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "kernelFrom: $($info.kernelFrom)"
          Write-Host "payloadDir: $($info.payloadDir)"
          if (-not $info.payloadDir) { Write-Error "payload dir missing from the package"; exit 1 }
          if ($info.kernelFrom -notlike "*payload*") {
            Write-Error "payload is NOT shadowing the bundled kernel (kernelFrom=$($info.kernelFrom))"
            exit 1
          }
          Write-Host "payload overlay ok: kernel loads from the payload dir"

      - name: Probe native zoom capability (windowed)
        shell: pwsh
        # 上面那些探活都是 --no-window 起的：进程里根本没有窗口，所以
        # /api/desktop/zoom 只会回答"没有控件"，**证明不了窗口模式能用**。
        # 这一步带窗口再起一次，并把进程退出码与 startup.log 打出来 ——
        # 崩了和"runner 没桌面"必须能分开看。仍然 continue-on-error：
        # runner 上桌面会话未必可用，降级不该染红流水线。
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath dist\OpenMinisDesktop\OpenMinisDesktop.exe -ArgumentList "--port","8803" -PassThru
          $zoom = $null
          # 令牌按端口过滤：上一步那个实例的令牌还留在文件里。
          $access = $null
          for ($i = 0; $i -lt 25; $i++) {
            Start-Sleep -Seconds 2
            $p.Refresh(); if ($p.HasExited) { break }
            try {
              $access = Get-Content "$env:USERPROFILE\openminis\.desktop-access.json" -Raw | ConvertFrom-Json
              if ($access.token -and $access.port -eq 8803) { break }
            } catch { }
          }
          $auth = @{ 'x-minis-desktop-access' = $access.token }
          for ($i = 0; $i -lt 15; $i++) {
            try {
              $zoom = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 -Headers $auth "http://127.0.0.1:8803/api/desktop/zoom").Content
              if ($zoom) { break }
            } catch { }
            Start-Sleep -Seconds 1
          }
          $p.Refresh()
          if ($zoom) {
            Write-Host "::notice::windowed zoom capability: $zoom"
            try {
              $set = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 -Method Post `
                      -ContentType 'application/json' -Body '{"factor":1.0}' -Headers $auth `
                      "http://127.0.0.1:8803/api/desktop/zoom").Content
              Write-Host "::notice::native zoom set: $set"
              if ($set.StartsWith('{"ok":true')) { Write-Host "native zoom is usable on Windows" }
              else { Write-Host "::warning::native zoom NOT usable — see reason above" }
            } catch { Write-Host "::warning::native zoom set request failed: $_" }
          } elseif ($p.HasExited) {
            Write-Host "::error::windowed exe exited early (exit code $($p.ExitCode)) — 窗口模式崩了，别当成 runner 没桌面"
            $log = Join-Path $env:USERPROFILE 'openminis\logs\startup.log'
            if (Test-Path $log) { Write-Host "--- startup.log tail"; Get-Content $log -Tail 25 }
          } else {
            Write-Host "::warning::windowed exe is alive but never served HTTP within 50s"
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          exit 0

      - name: Package the folder
        shell: pwsh
        run: |
          Compress-Archive -Path dist\OpenMinisDesktop -DestinationPath dist\OpenMinisDesktop-portable.zip
          Get-Item dist\OpenMinisDesktop-portable.zip | Select-Object Name, Length

      - name: Simulate a browser download (MOTW) and verify the app heals itself
        shell: pwsh
        # 真实用户的文件**永远**来自浏览器下载：Windows 会给每个文件加上
        # ``Zone.Identifier``（MOTW），而 .NET 拒绝从带这个标记的文件里加载程序集 ——
        # v0.4.6 的便携版就这样在一台新电脑上「双击没反应」（pythonnet 的
        # Python.Runtime.dll 加载失败 → 退出码 1 → 窗口版没有控制台，什么都看不见）。
        #
        # 而 CI 的文件都是本机构建的，**天生没有这个标记**，所以永远发现不了这一类
        # 问题。这里人为打上标记，把自动化流程和真实用户之间这段结构性盲区补掉。
        run: |
          $root = "dist\OpenMinisDesktop"
          function Marked-Files {
            @(Get-ChildItem $root -Recurse -File | Where-Object {
              $null -ne (Get-Item -LiteralPath $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue)
            })
          }
          Get-ChildItem $root -Recurse -File | ForEach-Object {
            Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier `
                        -Value "[ZoneTransfer]`nZoneId=3" -Encoding ascii
          }
          $marked = Marked-Files
          if ($marked.Count -lt 100) { Write-Error "标记没打上（只有 $($marked.Count) 个）"; exit 1 }
          Write-Host "已给 $($marked.Count) 个文件打上网络来源标记（模拟浏览器下载 + 解压）"

          # 主 exe 单独放行 —— 模拟用户已经在 SmartScreen 上点了「仍要运行」。
          # 不放行的话，带标记的 exe 会直接被 SmartScreen 拦掉（报
          # "The operation was canceled by the user"），那测到的就不是 .NET 加载了。
          # 真实用户点的就是这一步，之后翻车的是 .NET 加载 DLL 那一环。
          Unblock-File -LiteralPath "$root\OpenMinisDesktop.exe"

          # (1) 对照组：不解除锁定时，它确实起不来吗？没这一步，下面的"自愈成功"
          #     可能只是碰巧（.NET 可能根本没复现）。
          $env:OPENMINIS_MOTW = "ignore"
          $p = Start-Process -FilePath "$root\OpenMinisDesktop.exe" -ArgumentList "--port","8805" -PassThru
          $alive = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 2
            $p.Refresh(); if ($p.HasExited) { break }
            try {
              $null = Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 "http://127.0.0.1:8805/api/health"
              $alive = $true; break
            } catch { }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if ($alive) {
            Write-Host "::warning::带着 MOTW 也起来了 —— 这台机器的 .NET 没复现该问题，对照组无效（自愈断言仍然有效）"
          } else {
            Write-Host "对照组确认：带 MOTW 且不解除锁定时，应用起不来（退出码 $($p.ExitCode)）"
          }

          # (2) 打开自愈：必须能起来
          $env:OPENMINIS_MOTW = "unblock"
          $p = Start-Process -FilePath "$root\OpenMinisDesktop.exe" -ArgumentList "--port","8806" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            $p.Refresh(); if ($p.HasExited) { break }
            try {
              $null = Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 "http://127.0.0.1:8806/api/health"
              $ok = $true; break
            } catch { }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) {
            $log = Join-Path $env:USERPROFILE 'openminis\logs\desktop.log'
            Write-Host "--- desktop.log tail"
            if (Test-Path $log) { Get-Content $log -Tail 25 }
            Write-Error "自愈之后仍然起不来（退出码 $($p.ExitCode)）"
            exit 1
          }
          Write-Host "自愈生效：解除锁定后应用正常启动"

          # (3) 标记必须真的被清掉 —— 否则上面的"成功"可能只是碰巧 .NET 放行
          $left = Marked-Files
          if ($left.Count -gt 0) { Write-Error "自愈没清干净，还剩 $($left.Count) 个带标记的文件"; exit 1 }
          Write-Host "标记已全部清除（$($marked.Count) 个）"
          $env:OPENMINIS_MOTW = ""

      - name: Build the update manifest (latest.json)
        shell: pwsh
        # 应用内"检查更新"就是去 releases/latest/download/latest.json 拉这个文件
        # （固定地址，不吃 GitHub API 限流）。壳指纹在这里进清单。
        run: |
          $tag = "${{ github.ref_name }}"
          python scripts/make_latest.py --dist dist --tag $tag --notes "见 release 说明"
          if ($LASTEXITCODE -ne 0) { Write-Error "latest.json build failed"; exit 1 }
          Get-Content dist\latest.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinisDesktop-windows-portable
          path: |
            dist/OpenMinisDesktop-portable.zip
            dist/OpenMinisDesktop-update.zip
            dist/latest.json
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OpenMinisDesktop-portable.zip
            dist/OpenMinisDesktop-update.zip
            dist/latest.json
          generate_release_notes: true
          body: |
            ## OpenMinis Desktop ${{ github.ref_name }}

            Windows 桌面版（原生窗口，基于 OpenMinis 内核）。

            下载 `OpenMinisDesktop-portable.zip`，解压后双击文件夹里的
            `OpenMinisDesktop.exe`。无需安装 Python 或 Node。
            首次启动会在 `%USERPROFILE%\openminis`（即 `C:\Users\<你的用户名>\openminis`）建数据目录，然后在设置里
            配置模型服务（OpenAI / Anthropic / 任意 OpenAI 兼容网关）。


            - 快捷键：`Ctrl+K` 命令面板、`Ctrl+\`` 终端、`Ctrl+B` 左侧面板、`Ctrl+N` 新会话、
              `Ctrl+O` 打开文件夹、`Ctrl+,` 设置、`Esc` 关闭当前文件
            - 界面：菜单栏（文件/视图/帮助）、活动栏、可多标签看代码（同时最多 10 个）、
              文件树可指向任意目录
            - 首次运行若提示缺少 WebView2，装一次微软的
              [WebView2 Runtime](https://developer.microsoft.com/microsoft-edge/webview2/)（Win10 较老版本可能需要）
            - 想知道启动那几秒花在哪：`%USERPROFILE%\openminis\logs\startup.log`
              每次启动写一行（解包 / 内核 / 后端 / 窗口各自的累计毫秒）。
              设环境变量 `OPENMINIS_NO_SPLASH=1` 可以退回旧的启动顺序，用来对比。

            **更新**：装好之后在界面里「设置 → 关于」点「检查更新」就行 —— 内核与界面的
            更新只有 2~3 MB，装完点一下重启生效，不用重下整包。

            **解压后双击没反应？** 那是 Windows 给「从网上下载的文件」打的标记
            （MOTW）：Windows 自带解压工具会把它传染给解压出来的每一个文件，而 .NET
            拒绝加载带这个标记的 DLL。应用现在会**自己弹窗问你要不要解除锁定**，点
            「是」即可；也可以一开始就用 7-Zip 之类解压，或先跑一句
            `Get-ChildItem . -Recurse -File | Unblock-File`。

